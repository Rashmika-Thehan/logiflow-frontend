<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LogiFlow Agent – Flow</title>
  <style>
    :root {
      color-scheme: dark;
      --s0: #000;
      --s2: #181818;
      --s4: #272727;
      --s5: #313131;
      --fg: #fff;
      --muted: #9b9b9b;
      --blue: #60a5fa;
      box-sizing: border-box
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      background: transparent;
      color: var(--fg);
      font-family: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden
    }

    #wrap {
      position: relative;
      height: 100%;
      overflow: hidden;
      background: transparent
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none
    }
  </style>
</head>

<body>
  <div id="wrap"></div>
  <script data-cfasync="false" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script data-cfasync="false">
    (function () {
      function startFlow() {
        if (typeof THREE === 'undefined') {
          setTimeout(startFlow, 30);
          return;
        }

        const wrap = document.getElementById('wrap') || document.body;
        const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(30, 1, .1, 100); cam.position.set(0, .8, 11); cam.lookAt(0, .6, 0);
      const ren = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      ren.setPixelRatio(Math.min(devicePixelRatio, 2)); ren.setClearColor(0, 0);
      ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.15;
      ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
      wrap.insertBefore(ren.domElement, wrap.firstChild);

      (function () {
        const e = new THREE.Scene();
        e.add(new THREE.Mesh(new THREE.BoxGeometry(30, 30, 30), new THREE.MeshBasicMaterial({ color: 0x06080d, side: THREE.BackSide })));
        [[0x60a5fa, 5, [-8, 5, 8], [6, 3]], [0xffffff, 4, [0, 12, 2], [10, 2]], [0x34d399, 4, [8, 3, -8], [6, 2]], [0xfbbf24, 2.5, [8, -1, 6], [3, 2]]].forEach(l => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(l[3][0], l[3][1]), new THREE.MeshBasicMaterial({ color: new THREE.Color(l[0]).multiplyScalar(l[1]), side: THREE.DoubleSide }));
          m.position.set(...l[2]); m.lookAt(0, 0, 0); e.add(m)
        });
        const pm = new THREE.PMREMGenerator(ren); scene.environment = pm.fromScene(e, .04).texture; pm.dispose()
      })();
      const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(2, 9, 5); key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -5; key.shadow.camera.right = 5; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8; key.shadow.radius = 6; key.shadow.bias = -.0005; scene.add(key);
      const bounce = new THREE.PointLight(0x60a5fa, 1.4, 10); bounce.position.set(0, -2.2, 1.5); scene.add(bounce);
      scene.add(new THREE.HemisphereLight(0x8899bb, 0x050505, .35));

      function capsule(r, len) {
        const p = [], n = 10; for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + Math.PI / 2 * i / n; p.push(new THREE.Vector2(Math.max(r * Math.cos(a), 1e-4), -len / 2 + r * Math.sin(a))) }
        for (let i = 0; i <= n; i++) { const a = Math.PI / 2 * i / n; p.push(new THREE.Vector2(Math.max(r * Math.cos(a), 1e-4), len / 2 + r * Math.sin(a))) } return new THREE.LatheGeometry(p, 40)
      }
      function rbox(w, h, d, r, b) {
        b = b || .03; const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
        s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
        const g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 3, curveSegments: 10 }); g.translate(0, 0, -(d - 2 * b) / 2); return g
      }
      function glowTex() { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c) }
      const GT = glowTex();
      const B = (c, o) => new THREE.MeshBasicMaterial(Object.assign({ color: c, toneMapped: false }, o));
      const white = new THREE.MeshPhysicalMaterial({ color: 0xf2f2ef, roughness: .38, metalness: .05, clearcoat: 1, clearcoatRoughness: .12 });
      const dark = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: .9, roughness: .28 });
      const glass = new THREE.MeshPhysicalMaterial({ color: 0x020202, roughness: .05, metalness: .3, clearcoat: 1, clearcoatRoughness: .03 });
      const amber = new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xfbbf24, emissiveIntensity: .55, roughness: .4 });
      const vis = new THREE.Color(0x60a5fa), visM = B(vis);
      const agent = new THREE.Group(); agent.name = 'flow-agent'; scene.add(agent);
      const body = new THREE.Group(); agent.add(body);
      function add(g, m, x, y, z, p) { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); (p || body).add(o); return o }

      add(capsule(.9, 1.2), white, 0, 0, 0).scale.z = .65;
      const belt = add(new THREE.TorusGeometry(.88, .03, 12, 64), amber, 0, -.8, 0); belt.scale.set(1, .65, 1); belt.rotation.x = Math.PI / 2;
      add(new THREE.CylinderGeometry(.45, .3, .3, 32), dark, 0, -1.65, 0);
      add(new THREE.CylinderGeometry(.25, .28, .3, 24), dark, 0, 1.55, 0);
      // ---- chest: dynamic digital status tag badge on the body
      const tagCanvas = document.createElement('canvas');
      tagCanvas.width = 512; tagCanvas.height = 160;
      const tagCtx = tagCanvas.getContext('2d');
      const tagTex = new THREE.CanvasTexture(tagCanvas);
      tagTex.anisotropy = 4;
      const tagMat = B(0xffffff, { map: tagTex, transparent: true });

      // Beveled dark backing bezel
      add(rbox(.76, .26, .03, .05, .008), dark, 0, .5, .59);
      // Digital tag badge
      add(new THREE.PlaneGeometry(.72, .225), tagMat, 0, .5, .612);

      function updateTagBadge(s, hexColor) {
        const w = 512, h = 160, r = 36;
        tagCtx.clearRect(0, 0, w, h);

        // Dark pill background
        tagCtx.fillStyle = 'rgba(8, 10, 16, 0.94)';
        tagCtx.beginPath();
        tagCtx.moveTo(r, 6);
        tagCtx.lineTo(w - r, 6);
        tagCtx.quadraticCurveTo(w - 6, 6, w - 6, r);
        tagCtx.lineTo(w - 6, h - r);
        tagCtx.quadraticCurveTo(w - 6, h - 6, w - r, h - 6);
        tagCtx.lineTo(r, h - 6);
        tagCtx.quadraticCurveTo(6, h - 6, 6, h - r);
        tagCtx.lineTo(6, r);
        tagCtx.quadraticCurveTo(6, 6, r, 6);
        tagCtx.closePath();
        tagCtx.fill();

        // Border in state accent color
        tagCtx.strokeStyle = hexColor;
        tagCtx.lineWidth = 6;
        tagCtx.stroke();

        // Subtle inner rim
        tagCtx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
        tagCtx.lineWidth = 2;
        tagCtx.stroke();

        const label = s.toUpperCase();
        tagCtx.font = 'bold 50px "Geist", "Inter", system-ui, -apple-system, sans-serif';
        tagCtx.textBaseline = 'middle';

        const metrics = tagCtx.measureText(label);
        const dotR = 13;
        const gap = 20;
        const totalW = dotR * 2 + gap + metrics.width;
        const startX = (w - totalW) / 2;

        // Glowing indicator dot
        tagCtx.fillStyle = hexColor;
        tagCtx.shadowColor = hexColor;
        tagCtx.shadowBlur = 24;
        tagCtx.beginPath();
        tagCtx.arc(startX + dotR, h / 2, dotR, 0, Math.PI * 2);
        tagCtx.fill();

        // Clean sharp white label
        tagCtx.shadowBlur = 0;
        tagCtx.fillStyle = '#ffffff';
        tagCtx.fillText(label, startX + dotR * 2 + gap, h / 2);

        tagTex.needsUpdate = true;
      }
      add(new THREE.BoxGeometry(.7, .03, .01), B(0x777777), 0, .0, .6);
      add(new THREE.CircleGeometry(.07, 24), B(0x34d399), -.35, 0, .61);
      add(rbox(.14, .14, .02, .03, .005), B(0xf87171), .35, 0, .6);
      const routeDot = add(new THREE.CircleGeometry(.04, 16), B(0xffffff), -.35, 0, .63);
      const ledCols = [0x34d399, 0x60a5fa, 0xfbbf24], ledMul = [1, .7, .45], ledMats = ledCols.map((c, i) => { const m = B(c); add(new THREE.BoxGeometry(.2, .06, .03), m, (i - 1) * .32, -.42, .58); return m });

      const head = new THREE.Group(); head.name = 'head'; head.position.y = 1.65; body.add(head);
      const hm = add(capsule(.75, .7), white, 0, .75, 0, head); hm.rotation.z = Math.PI / 2; hm.scale.z = .9;
      add(rbox(1.5, .78, .12, .34, .02), glass, 0, .75, .66, head);
      const eyes = [-.34, .34].map(x => add(capsule(.07, .16), visM, x, .75, .73, head));
      const shim = add(new THREE.PlaneGeometry(.22, .6), B(0xffffff, { transparent: true, opacity: .28, blending: THREE.AdditiveBlending, depthWrite: false }), 0, .75, .735, head);
      const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GT, color: vis, transparent: true, opacity: .4, blending: THREE.AdditiveBlending, depthWrite: false })); halo.scale.set(3, 1.3, 1); halo.position.set(0, .75, .85); head.add(halo);
      [-1, 1].forEach(s => { const p = add(new THREE.CylinderGeometry(.3, .3, .14, 32), amber, s * 1.12, .75, 0, head); p.rotation.z = Math.PI / 2 });
      add(new THREE.CylinderGeometry(.025, .025, .5, 12), dark, .5, 1.72, 0, head);
      const tipM = B(0x34d399); add(new THREE.SphereGeometry(.1, 20, 20), tipM, .5, 2.12, 0, head); add(new THREE.ConeGeometry(.1, .2, 20), tipM, .5, 1.99, 0, head).rotation.x = Math.PI;

      function makeArm(side) {
        const sh = new THREE.Group(); sh.position.set(side * 1.08, .6, 0); body.add(sh);
        add(new THREE.SphereGeometry(.22, 24, 24), dark, 0, 0, 0, sh);
        add(capsule(.14, .5), white, 0, -.4, 0, sh);
        const el = new THREE.Group(); el.position.y = -.8; sh.add(el);
        add(new THREE.SphereGeometry(.15, 20, 20), dark, 0, 0, 0, el);
        add(capsule(.12, .4), white, 0, -.4, 0, el);
        add(new THREE.TorusGeometry(.12, .025, 10, 32), amber, 0, -.78, 0, el).rotation.x = Math.PI / 2;
        add(new THREE.SphereGeometry(.2, 24, 24), white, 0, -.98, 0, el).scale.set(1, 1.1, .85);
        return { sh, el }
      }
      const L = makeArm(-1), R = makeArm(1);

      const diskM = B(vis, { transparent: true, opacity: .8 });
      const disk = add(new THREE.CylinderGeometry(1, 1, .06, 48), diskM, 0, -2.15, 0, agent); disk.scale.set(1.15, 1, .8);
      const floor = add(new THREE.PlaneGeometry(1, 1), B(vis, { map: GT, transparent: true, opacity: .5, blending: THREE.AdditiveBlending, depthWrite: false }), 0, -2.5, 0, agent); floor.rotation.x = -Math.PI / 2; floor.scale.set(6, 4, 1);
      const sh = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: .45 })); sh.rotation.x = -Math.PI / 2; sh.position.y = -2.52; sh.receiveShadow = true; scene.add(sh);
      body.traverse(o => { if (o.isMesh && o.material.isMeshStandardMaterial) { o.castShadow = true } });

      const tipPos = [.5, 2.12, 0];
      const mk = (c, r) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r, .012, 8, 64), B(c, { transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false })); m.rotation.x = Math.PI / 2; m.position.set(...tipPos); head.add(m); return m };
      const rings = [0, 1, 2].map(() => mk(0x22d3ee, .3)), mic = mk(0xffffff, .3);
      const N = 60, pp = new Float32Array(N * 3), pv = []; for (let i = 0; i < N; i++)pv.push(new THREE.Vector3());
      const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(pp, 3));
      const pm = new THREE.PointsMaterial({ color: 0x34d399, size: .09, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
      agent.add(new THREE.Points(pg, pm)); let pT = -9;
      function burst() { pT = clock.getElapsedTime(); for (let i = 0; i < N; i++) { pp.set([(Math.random() - .5) * 1.2, 2.4, .8], i * 3); pv[i].set((Math.random() - .5) * 2.4, Math.random() * 1.8 + .3, Math.random() * 1.4) } }

      const STATES = {
        idle: ['idle', 0x60a5fa],
        dispatching: ['dispatching', 0x60a5fa],
        alert: ['alert', 0xf87171],
        success: ['success', 0x34d399],
        tracking: ['tracking', 0x60a5fa],
        listening: ['listening', 0x60a5fa]
      };
      let state = 'idle', st = 0, timer; const clock = new THREE.Clock();

      function setState(s) {
        if (!STATES[s]) return; state = s; st = clock.getElapsedTime(); clearTimeout(timer);
        if (s === 'success') { burst(); timer = setTimeout(() => setState('idle'), 3500) }
        const hex = '#' + new THREE.Color(STATES[s][1]).getHexString();
        updateTagBadge(STATES[s][0], hex);
      }
      // expose globally so parent can call via postMessage
      window.flow = { setState };
      window.addEventListener('message', e => {
        if (e.data) {
          if (e.data.flowState) setState(e.data.flowState);
          if (e.data.flowMouse) { mouse.x = e.data.flowMouse.x; mouse.y = e.data.flowMouse.y }
        }
      });
      setState('idle');

      const mouse = { x: 0, y: 0 }, ray = new THREE.Raycaster(), pt = new THREE.Vector2();
      function pos(e) { const r = ren.domElement.getBoundingClientRect(); pt.x = ((e.clientX - r.left) / r.width) * 2 - 1; pt.y = -((e.clientY - r.top) / r.height) * 2 + 1; mouse.x = pt.x * .8; mouse.y = pt.y * .8 }
      function hit() { ray.setFromCamera(pt, cam); return ray.intersectObject(body, true).length > 0 }
      ren.domElement.addEventListener('pointermove', e => { pos(e); ren.domElement.style.cursor = hit() ? 'pointer' : 'default' });
      ren.domElement.addEventListener('pointerdown', e => { pos(e); if (hit()) setState('success') });
      function resize() {
        const w = wrap.clientWidth || window.innerWidth;
        const h = wrap.clientHeight || window.innerHeight;
        if (!w || !h) return;
        ren.setSize(w, h, false);
        cam.aspect = w / h;
        cam.fov = w / h < .8 ? 44 : 30;
        cam.updateProjectionMatrix();
      }
      if (window.ResizeObserver) {
        new ResizeObserver(resize).observe(wrap);
      }
      window.addEventListener('resize', resize);
      resize();
      window.addEventListener('pagehide', () => { scene.traverse(o => { if (o.geometry) o.geometry.dispose() }); ren.dispose() });

      const cur = { rz: .3, rx: 0, fz: -.4, lfz: -.4, hx: 0, hy: 0, hz: 0, ay: -.2 }, lerp = (a, b, k) => a + (b - a) * k, tgt = new THREE.Color();
      ren.setAnimationLoop(() => {
        const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime, e = t - st, k = Math.min(1, dt * 6);
        tgt.setHex(STATES[state][1]); vis.lerp(tgt, .12);
        visM.color.copy(vis); halo.material.color.copy(vis); diskM.color.copy(vis); floor.material.color.copy(vis); bounce.color.copy(vis);
        let y = Math.sin(t * 2 * Math.PI / 3) * .08, x = 0;
        if (state === 'success') y += .12 * Math.exp(-e * 4) * Math.cos(e * 18);
        if (state === 'alert' && e < .6) x = Math.sin(e * 2 * Math.PI / .12) * .04;
        body.position.set(x, y, 0);
        cur.ay = lerp(cur.ay, -.2 + mouse.x * .28, k);
        agent.rotation.y = cur.ay;
        let hy = Math.sin(t * 2 * Math.PI / 4) * .052, hx = -mouse.y * .32 + (state === 'tracking' ? .14 : 0), hz = state === 'listening' ? -.087 : 0;
        if (state === 'dispatching') hy = Math.sin(t * 2 * Math.PI / 1.2) * .35; else hy += mouse.x * .65;
        cur.hy = lerp(cur.hy, hy, k); cur.hx = lerp(cur.hx, hx, k); cur.hz = lerp(cur.hz, hz, k); head.rotation.set(cur.hx, cur.hy, cur.hz);
        const rz = state === 'success' ? (e < 1.5 ? 2.4 + Math.sin(e * 9) * .25 : .3) : .3, rx = state === 'dispatching' ? -.5 : 0;
        const fz = state === 'dispatching' ? -1 : state === 'listening' ? -.8 : state === 'success' ? -.3 : -.4, lfz = state === 'listening' ? -.8 : -.4;
        cur.rz = lerp(cur.rz, rz, k); cur.rx = lerp(cur.rx, rx, k); cur.fz = lerp(cur.fz, fz, k); cur.lfz = lerp(cur.lfz, lfz, k);
        R.sh.rotation.set(cur.rx, 0, cur.rz); R.el.rotation.x = cur.fz; L.sh.rotation.set(0, 0, -.3); L.el.rotation.x = cur.lfz;
        const P = { dispatching: .83, tracking: .8 }[state] || 2.5; shim.position.x = -.6 + ((t / P) % 1) * 1.2;
        halo.material.opacity = state === 'listening' ? .65 : state === 'success' ? .6 : .4;
        const bl = (t % 4.2) < .12 ? .1 : 1; eyes.forEach(o => o.scale.y = bl);
        routeDot.position.x = -.35 + ((t / (state === 'dispatching' ? .8 : 2.2)) % 1) * .7;
        const cyc = state === 'dispatching' ? .3 : 2;
        ledMats.forEach((m, i) => { const p = .5 + .5 * Math.sin((t - i * .3 * (cyc / 2)) * 2 * Math.PI / cyc); m.color.setHex(ledCols[i]).multiplyScalar(ledMul[i] * (.35 + .65 * p)) });
        diskM.opacity = .8 + .2 * Math.sin(t * Math.PI);
        if (state === 'alert') { diskM.opacity = Math.sin(t * 14) > 0 ? 1 : .25; tipM.color.setHex(0xf87171).multiplyScalar(.5 + .5 * Math.sin(t * 2 * Math.PI / .4)) }
        else tipM.color.setHex(0x34d399).multiplyScalar(.6 + .4 * Math.sin(t * 2 * Math.PI / 1.8));
        rings.forEach((r, i) => {
          let a = 0, s = 1;
          if (state === 'dispatching' && i === 0) { const p = (t / 1.6) % 1; s = .4 + p * 3; a = 1 - p }
          if (state === 'tracking') { const p = ((t / 1.5) - i * .33 + 3) % 1; s = .4 + p * 3; a = (1 - p) * .8 }
          r.scale.set(s, s, s); r.material.opacity = lerp(r.material.opacity, a, .5)
        });
        const mp = (t / 1.4) % 1; mic.scale.setScalar(.5 + mp * 3); mic.material.opacity = state === 'listening' ? (1 - mp) * .8 : 0;
        const pa = t - pT; if (pa < 1.5) { for (let i = 0; i < N; i++) { pp[i * 3] += pv[i].x * dt; pp[i * 3 + 1] += pv[i].y * dt; pp[i * 3 + 2] += pv[i].z * dt } pg.attributes.position.needsUpdate = true; pm.opacity = 1 - pa / 1.5 } else pm.opacity = 0;
        ren.render(scene, cam)
      });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startFlow);
      } else {
        startFlow();
      }
    })();
  </script>
</body>

</html>
