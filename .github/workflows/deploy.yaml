name: Deploy to Cloudflare

on:
  push:
    branches: [ci-cd, feat/hero-3d-model]
  workflow_dispatch:

# Only one deploy at a time; a newer push cancels an older in-flight run
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Vite bakes these into the bundle at build time (they are public).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CALLBACK_URL: ${{ vars.VITE_GOOGLE_CALLBACK_URL }}

      - name: Deploy to Cloudflare Workers (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
